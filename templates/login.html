<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Website Phishing Detection Using ML</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style_premium.css') }}">
    <style>
        .login-container {
            max-width: 450px;
            margin: 10vh auto;
        }
        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .login-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #94a3b8;
        }
        .login-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 1rem;
            padding: 1.25rem;
            color: #fff;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
        }
        .login-input:focus {
            border-color: var(--primary);
        }
        .login-btn {
            width: 100%;
            margin-top: 1rem;
        }
    </style>
    <script>
        function login() {
            var uname = document.getElementById("uname").value;
            var pwd = document.getElementById("pwd").value;

            if (uname == "admin" && pwd == "admin") {
                alert("Access Granted!");
                window.location = "{{url_for('home')}}";
                return false;
            } else {
                alert("Invalid Credentials!");
            }
        }
    </script>
</head>
<body>
    <div class="bg-overlay"></div>

    <div class="container-premium login-container animate-fade">
        <div class="glass-card">
            <div class="login-header">
                <h1>Welcome Back</h1>
                <p style="color: #64748b;">Sign in to access the Command Center</p>
            </div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" id="uname" class="login-input" placeholder="Enter username">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="pwd" class="login-input" placeholder="••••••••">
            </div>

            <button class="premium-btn login-btn" onclick="login()">AUTHORIZE ACCESS</button>

            <div style="text-align: center; margin-top: 2rem;">
                <a href="{{ url_for('first') }}" style="color: #64748b; text-decoration: none; font-size: 0.9rem;">&larr; Back to Home</a>
            </div>
        </div>
    </div>
</body>
</html>
