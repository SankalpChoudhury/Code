<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Website Phishing Detection Using ML</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style_premium.css') }}">
    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false;
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
        };
    </script>
    <style>
        .login-container {
            max-width: 450px;
            margin: 10vh auto;
        }
        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .login-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #94a3b8;
        }
        .login-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 1rem;
            padding: 1.25rem;
            color: #fff;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
        }
        .login-input:focus {
            border-color: var(--primary);
        }
        .login-btn {
            width: 100%;
            margin-top: 1rem;
        }
        .alert {
            padding: 1rem;
            border-radius: 0.75rem;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            text-align: center;
        }
        .alert-danger {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .alert-warning {
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }
        .alert-success {
            background: rgba(34, 197, 94, 0.1);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }
    </style>
</head>
<body>
    <div class="bg-overlay"></div>

    <div class="container-premium login-container animate-fade">
        <div class="glass-card">
            <div class="login-header">
                <h1>User Portal</h1>
                <p style="color: #64748b;">Sign in to access analysis tools</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form action="{{ url_for('login') }}" method="POST">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" class="login-input" placeholder="" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" class="login-input" placeholder="" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label>Security Check: {{ captcha_text }} = ?</label>
                    <input type="number" name="captcha_answer" class="login-input" placeholder="Answer" required autocomplete="off">
                </div>

                <button type="submit" class="premium-btn login-btn">AUTHORIZE ACCESS</button>
            </form>

            <div style="text-align: center; margin-top: 2rem;">
                <p style="color: #64748b; font-size: 0.9rem;">Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign Up</a></p>
            </div>

            <div style="text-align: center; margin-top: 1rem;">
                <a href="{{ url_for('admin_login') }}" style="color: #64748b; text-decoration: none; font-size: 0.8rem; opacity: 0.6;">Administrator Portal</a>
            </div>
            
            <div style="text-align: center; margin-top: 1rem;">
                <a href="{{ url_for('first') }}" style="color: #64748b; text-decoration: none; font-size: 0.9rem;">&larr; Back to Home</a>
            </div>
        </div>
    </div>
</body>
</html>
