services:
  - type: web
    name: phishing-detection-platform
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0 # Adjust if needed
      - key: FLASK_DEBUG
        value: "false"
